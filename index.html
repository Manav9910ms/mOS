<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mOS</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #4f6fbd;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    .workspace {
      position: fixed;
      inset: 0;
      padding: 24px;
      display: flex;
      align-content: flex-start;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
    }

    .context-menu {
      position: fixed;
      z-index: 9999;
      width: 180px;
      padding: 6px;
      display: none;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }

    .context-menu.visible {
      display: block;
    }

    .context-menu button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }

    .context-menu button:hover {
      background: #eef2ff;
    }

    .desktop-item {
      width: 86px;
      min-height: 88px;
      padding: 8px 6px;
      box-sizing: border-box;
      color: #ffffff;
      text-align: center;
      border-radius: 8px;
    }

    .desktop-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .item-icon {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 7px;
    }

    .item-name {
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <script src="js/mos.js"></script>
</body>
</html>
